# Signal Lab local stack. Ports (all bound to 127.0.0.1):
#   8088  NGINX: web monitor, REST API, WebSocket, /metrics   (SIGNALLAB_PORT)
#   9090  Prometheus UI
# PostgreSQL and the Go service are only reachable inside the compose network.
name: signallab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signallab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signallab}
      POSTGRES_DB: ${POSTGRES_DB:-signallab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      SIGNALLAB_DATABASE_URL: postgres://${POSTGRES_USER:-signallab}:${POSTGRES_PASSWORD:-signallab}@postgres:5432/${POSTGRES_DB:-signallab}?sslmode=disable
      SIGNALLAB_AUTO_MIGRATE: "true"
      SIGNALLAB_QUEUE_CAPACITY: ${SIGNALLAB_QUEUE_CAPACITY:-1000}
      SIGNALLAB_WORKERS: ${SIGNALLAB_WORKERS:-4}
      SIGNALLAB_TEMP_ALERT_C: ${SIGNALLAB_TEMP_ALERT_C:-85}
      SIGNALLAB_VIB_ALERT_MM_S: ${SIGNALLAB_VIB_ALERT_MM_S:-7.1}
      SIGNALLAB_LAB_WORKER_DELAY: ${SIGNALLAB_LAB_WORKER_DELAY:-0s}
      SIGNALLAB_LOG_LEVEL: ${SIGNALLAB_LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/signallab", "healthcheck"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${SIGNALLAB_PORT:-8088}:80"
    depends_on:
      app:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app

volumes:
  pgdata:
