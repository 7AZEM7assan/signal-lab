# Reverse proxy for the Signal Lab demo: static monitor UI, REST API, WebSocket, metrics.
worker_processes auto;
events { worker_connections 1024; }

http {
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Upgrade only when the client asks for it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker's embedded DNS; re-resolving keeps the proxy working if the app container is recreated.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;
    client_max_body_size 1m;   # matches SIGNALLAB_MAX_BODY_BYTES; the service enforces its own limit too

    set $app app:8080;

    # WebSocket: HTTP/1.1 upgrade headers, and a long read timeout. The service pings
    # every 30 s, so idle-but-healthy connections stay open.
    location /ws {
      proxy_pass http://$app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;     # the service checks Origin against Host
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location /api/ {
      proxy_pass http://$app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-ID $request_id;
      proxy_next_upstream off;   # never silently re-send a POST to another upstream
    }

    # Probes and metrics. Exposed here only so the demo UI and curl can reach them;
    # see README security notes before copying this anywhere shared.
    location ~ ^/(healthz|readyz|metrics)$ {
      proxy_pass http://$app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
    }

    location / {
      root /usr/share/nginx/html;
      index index.html;
    }
  }
}
