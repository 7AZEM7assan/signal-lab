name: desktop

# Builds the desktop app for Linux, Windows and macOS. On a version tag (v*) it also attaches the
# installers to the GitHub release for that tag. The apps are not code-signed; see desktop/README.md.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**", "internal/appctl/**", "internal/appui/**", "internal/lab/**", "internal/sqlitestore/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, runner: ubuntu-24.04, target: linux, builder: "--linux --x64" }
          - { name: Windows, runner: windows-2025, target: win, builder: "--win --x64 --arm64" }
          - { name: macOS, runner: macos-15, target: mac, builder: "--mac --x64 --arm64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Check JavaScript syntax
        working-directory: desktop
        run: npm run check
      - name: Build the Go engine for every architecture of this OS
        working-directory: desktop
        run: node scripts/build-go.js --os ${{ matrix.target }}
      # On macOS the build is signed and notarized only if ALL of these repository secrets exist
      # (see "Signing and notarization" in desktop/README.md); otherwise it is an ad-hoc build.
      - name: Package
        working-directory: desktop
        env:
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.target == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.target == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.target == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: npx electron-builder ${{ matrix.builder }}
      - name: End-to-end smoke test of the packaged Linux app
        if: matrix.target == 'linux'
        working-directory: desktop
        env:
          SIGNALLAB_NO_SANDBOX: "1"
        run: |
          sudo apt-get update -y && sudo apt-get install -y xvfb
          SMOKE_PACKAGED="$PWD/dist/linux-unpacked/signal-lab" xvfb-run -a node test/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: signal-lab-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.dmg

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release if needed and upload the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la assets
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Signal Lab $TAG" --generate-notes
          fi
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
