[project]
name = "signallab-sim"
version = "0.1.0"
description = "Deterministic sensor-data generator, JSONL replayer and fault injector for Signal Lab"
requires-python = ">=3.11"
dependencies = []  # the simulator itself uses only the standard library

[project.optional-dependencies]
dev = ["pytest>=8", "websockets>=13", "ruff>=0.6"]

[project.scripts]
signallab-sim = "signallab_sim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["signallab_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "sil: software-in-the-loop tests; start the service and PostgreSQL with Docker Compose",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
